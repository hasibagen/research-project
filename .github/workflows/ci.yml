name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Template & contract tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install pytest jsonschema
          # `rocrate` is an optional dependency of the record adapter; the export
          # tests skip themselves when it is absent, but CI installs it so the
          # RO-Crate export path is actually exercised.
          pip install rocrate

      - name: Tests (templates, records, plan checker)
        run: python -m pytest tests modules/plan/tests -q

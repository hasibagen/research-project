<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="research-project">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="layer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E0E7FF"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#bg)"/>

  <!-- structure layer (bottom) : the fixed layout -->
  <g opacity="0.55">
    <rect x="44" y="150" width="168" height="26" rx="9" fill="url(#layer)"/>
    <rect x="44" y="186" width="168" height="26" rx="9" fill="url(#layer)"/>
  </g>

  <!-- action layer (top) : the seven modules -->
  <g opacity="0.95">
    <rect x="44" y="60" width="76" height="24" rx="9" fill="url(#layer)"/>
    <rect x="136" y="60" width="76" height="24" rx="9" fill="url(#layer)"/>
    <rect x="44" y="98" width="168" height="24" rx="9" fill="url(#layer)"/>
  </g>

  <!-- the connector between the two layers -->
  <g stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.9">
    <line x1="128" y1="126" x2="128" y2="146"/>
  </g>
  <circle cx="128" cy="136" r="9" fill="#FFFFFF"/>
</svg>
